<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>X 互动分析 · 原型 v2</title>
  <style>
    :root {
      --bg: #0a0a0b;
      --bg-elev: #141416;
      --bg-card: #1a1a1e;
      --bg-hover: #222228;
      --border: #2a2a30;
      --text: #f0f0f2;
      --text-muted: #8b8b96;
      --text-dim: #5c5c66;
      --progress: #00ba7c;
      --progress-track: #1e2a24;
      --tag-super: #f97316;
      --tag-super-bg: rgba(249, 115, 22, 0.15);
      --tag-fan: #3b82f6;
      --tag-fan-bg: rgba(59, 130, 246, 0.15);
      --tag-passer: #6b7280;
      --tag-passer-bg: rgba(107, 114, 128, 0.15);
      --ok: #00ba7c;
      --ok-bg: rgba(0, 186, 124, 0.12);
      --bad: #f4212e;
      --bad-bg: rgba(244, 33, 46, 0.12);
      --accent: #1d9bf0;
      --warn: #fbbf24;
      --radius: 12px;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.45;
      font-size: 14px;
    }
    .banner {
      background: #1c1917;
      border-bottom: 1px solid #292524;
      color: #a8a29e;
      font-size: 12px;
      padding: 8px 20px;
      text-align: center;
    }
    .banner strong { color: #fbbf24; font-weight: 600; }

    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-elev);
      position: sticky;
      top: 0;
      z-index: 40;
      flex-wrap: wrap;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 650;
      font-size: 16px;
      letter-spacing: -0.02em;
    }
    .brand-mark {
      width: 28px; height: 28px;
      border-radius: 8px;
      background: linear-gradient(135deg, #00ba7c, #1d9bf0);
      display: grid; place-items: center;
      font-size: 13px; font-weight: 700; color: #fff;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .btn {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: background .15s, border-color .15s;
      white-space: nowrap;
    }
    .btn:hover { background: var(--bg-hover); }
    .btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .btn.primary:hover { filter: brightness(1.08); }
    .btn.ghost { background: transparent; }
    .btn.danger-soft {
      background: var(--bad-bg);
      border-color: rgba(244,33,46,.35);
      color: #fb7185;
    }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .unlock-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(251, 191, 36, 0.12);
      color: var(--warn);
      border: 1px solid rgba(251, 191, 36, 0.25);
    }
    .unlock-pill.on {
      background: var(--ok-bg);
      color: var(--ok);
      border-color: rgba(0,186,124,.3);
    }

    nav.tabs {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      background: var(--bg);
      padding: 4px;
      border-radius: 10px;
      border: 1px solid var(--border);
      width: 100%;
      order: 3;
    }
    @media (min-width: 900px) {
      nav.tabs { width: auto; order: 0; flex: 1; justify-content: center; }
    }
    nav.tabs button {
      appearance: none;
      border: none;
      background: transparent;
      color: var(--text-muted);
      padding: 8px 12px;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
      transition: background .15s, color .15s;
    }
    nav.tabs button:hover { color: var(--text); background: var(--bg-hover); }
    nav.tabs button.active {
      background: var(--bg-card);
      color: var(--text);
      box-shadow: 0 0 0 1px var(--border);
    }

    main { padding: 20px; max-width: 1100px; margin: 0 auto; }
    .view { display: none; }
    .view.active { display: block; }

    /* 反差钩子 */
    .hook {
      background: linear-gradient(135deg, #141820 0%, #1a1a1e 60%, #1a1512 100%);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 22px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    .hook-text {
      font-size: clamp(20px, 4.5vw, 28px);
      font-weight: 750;
      letter-spacing: -0.03em;
      line-height: 1.25;
    }
    .hook-text .hi { color: var(--warn); }
    .hook-text .lo { color: #fb7185; }
    .hook-sub {
      margin-top: 8px;
      font-size: 13px;
      color: var(--text-muted);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 16px;
    }
    @media (max-width: 640px) {
      .stats { grid-template-columns: 1fr; }
    }
    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
    }
    .stat-card .label {
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 500;
      margin-bottom: 8px;
    }
    .stat-card .value {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums;
    }
    .stat-card .hint {
      margin-top: 6px;
      font-size: 11px;
      color: var(--text-dim);
    }

    .panel {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      position: relative;
    }
    .panel-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }
    .panel-head h2 { font-size: 15px; font-weight: 650; }
    .panel-head .meta { font-size: 12px; color: var(--text-muted); }

    .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 640px;
    }
    th {
      text-align: left;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-elev);
      white-space: nowrap;
    }
    td {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }
    tr:last-child td { border-bottom: none; }
    tbody tr { transition: background .12s; }
    tbody tr:hover { background: var(--bg-hover); }

    .user-cell {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 160px;
    }
    .user-cell.clickable { cursor: pointer; }
    .user-cell.clickable:hover .name { color: var(--accent); }
    .avatar {
      width: 40px; height: 40px;
      border-radius: 50%;
      display: grid; place-items: center;
      font-size: 13px; font-weight: 700;
      color: #fff;
      flex-shrink: 0;
    }
    .user-stack {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      width: 56px;
      flex-shrink: 0;
    }
    .user-row-reply {
      display: flex;
      align-items: flex-start;
      gap: 14px;
    }
    .name { font-weight: 600; font-size: 14px; }
    .handle { color: var(--text-muted); font-size: 12px; margin-top: 2px; }
    .tag {
      display: inline-flex;
      align-items: center;
      padding: 2px 7px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      line-height: 1.4;
      white-space: nowrap;
    }
    .tag.super { color: var(--tag-super); background: var(--tag-super-bg); }
    .tag.fan { color: var(--tag-fan); background: var(--tag-fan-bg); }
    .tag.passer { color: var(--tag-passer); background: var(--tag-passer-bg); }
    .preview {
      color: var(--text-muted);
      font-size: 13px;
      max-width: 280px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .time { color: var(--text-dim); font-size: 12px; white-space: nowrap; }
    .num { font-variant-numeric: tabular-nums; font-weight: 600; }
    .progress-cell {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 140px;
    }
    .bar {
      flex: 1;
      height: 6px;
      background: var(--progress-track);
      border-radius: 999px;
      overflow: hidden;
      min-width: 80px;
    }
    .bar > i {
      display: block;
      height: 100%;
      background: var(--progress);
      border-radius: 999px;
    }
    .pct {
      font-size: 12px;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
      min-width: 42px;
      text-align: right;
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
    }
    .status::before {
      content: "";
      width: 6px; height: 6px;
      border-radius: 50%;
      background: currentColor;
    }
    .status.ok { color: var(--ok); background: var(--ok-bg); }
    .status.bad { color: var(--bad); background: var(--bad-bg); }

    .footnote {
      margin-top: 16px;
      padding: 12px 14px;
      background: var(--bg-elev);
      border: 1px dashed var(--border);
      border-radius: 8px;
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.6;
    }
    .footnote code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px;
      color: #a3e635;
      background: #12180f;
      padding: 1px 5px;
      border-radius: 4px;
    }

    /* 付费墙 */
    .paywall-wrap { position: relative; }
    .paywall-blur {
      filter: blur(5px);
      pointer-events: none;
      user-select: none;
      opacity: .55;
    }
    .paywall-card {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: linear-gradient(180deg, rgba(10,10,11,.15) 0%, rgba(10,10,11,.72) 40%, rgba(10,10,11,.88) 100%);
      z-index: 5;
    }
    .paywall-inner {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 22px 24px;
      max-width: 360px;
      width: 100%;
      text-align: center;
      box-shadow: 0 16px 40px rgba(0,0,0,.45);
    }
    .paywall-inner h3 {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .paywall-inner p {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 14px;
      line-height: 1.5;
    }
    .price-row {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    .price-tag {
      font-size: 12px;
      font-weight: 650;
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg-elev);
      color: var(--text);
    }
    .price-tag em {
      font-style: normal;
      color: var(--warn);
      font-size: 15px;
    }

    /* Modal 通用 */
    .modal-backdrop {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.55);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 16px;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      width: min(420px, 100%);
      padding: 20px;
      box-shadow: 0 20px 50px rgba(0,0,0,.5);
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-head {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 16px;
    }
    .modal-head .avatar { width: 48px; height: 48px; font-size: 16px; }
    .modal h3 { font-size: 16px; font-weight: 650; }
    .modal .close {
      margin-left: auto;
      appearance: none;
      border: none;
      background: var(--bg-hover);
      color: var(--text-muted);
      width: 28px; height: 28px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
      flex-shrink: 0;
    }
    .modal .close:hover { color: var(--text); }
    .score-rows { display: flex; flex-direction: column; gap: 8px; }
    .score-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      background: var(--bg-elev);
      border-radius: 8px;
      font-size: 13px;
    }
    .score-row .k { color: var(--text-muted); }
    .score-row .v { font-weight: 650; font-variant-numeric: tabular-nums; }
    .score-total {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      font-weight: 700;
      font-size: 14px;
    }
    .empty {
      padding: 40px 20px;
      text-align: center;
      color: var(--text-muted);
    }
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #1f2937;
      color: #fff;
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      z-index: 200;
      opacity: 0;
      transition: transform .25s, opacity .25s;
      pointer-events: none;
      border: 1px solid #374151;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* 分享抽屉 */
    .share-modal {
      width: min(920px, 100%);
      padding: 0;
      display: flex;
      flex-direction: column;
      max-height: min(92vh, 860px);
    }
    .share-modal .share-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 18px;
      border-bottom: 1px solid var(--border);
      gap: 12px;
    }
    .share-modal .share-top h3 { font-size: 16px; }
    .share-body {
      display: grid;
      grid-template-columns: 200px 1fr;
      min-height: 0;
      flex: 1;
      overflow: hidden;
    }
    @media (max-width: 720px) {
      .share-body { grid-template-columns: 1fr; overflow-y: auto; }
    }
    .share-side {
      border-right: 1px solid var(--border);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: var(--bg-elev);
    }
    @media (max-width: 720px) {
      .share-side {
        border-right: none;
        border-bottom: 1px solid var(--border);
        flex-direction: row;
        flex-wrap: wrap;
      }
    }
    .tpl-btn {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-muted);
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      text-align: left;
      width: 100%;
    }
    @media (max-width: 720px) {
      .tpl-btn { width: auto; flex: 1 1 auto; text-align: center; }
    }
    .tpl-btn.active {
      color: var(--text);
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent);
    }
    .share-main {
      padding: 16px;
      overflow: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
    }
    .share-preview-wrap {
      width: min(100%, 320px);
      aspect-ratio: 1080 / 1350;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: 0 12px 40px rgba(0,0,0,.4);
    }
    .share-preview-wrap canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .share-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      width: 100%;
      padding-bottom: 8px;
    }
    .copy-box {
      width: 100%;
      max-width: 480px;
      background: var(--bg-elev);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.55;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div class="banner">
    <strong>示例数据 · 原型 v2</strong> — 反差钩子 · 分享卡 · 付费演示墙。非真实 X 拉取 / 非真支付。
  </div>

  <header class="app-header">
    <div class="brand">
      <div class="brand-mark">X</div>
      <span>互动分析</span>
    </div>
    <nav class="tabs" id="nav" aria-label="视图切换">
      <button type="button" data-view="overview" class="active">总览</button>
      <button type="button" data-view="replied-me">谁回复了我</button>
      <button type="button" data-view="i-replied">我回复了谁</button>
      <button type="button" data-view="no-reply">没回我的</button>
      <button type="button" data-view="visit">串门回访</button>
    </nav>
    <div class="header-actions">
      <span class="unlock-pill" id="unlock-pill">免费预览</span>
      <button type="button" class="btn" id="btn-export" disabled title="付费功能（演示）">导出</button>
      <button type="button" class="btn primary" id="btn-share">分享</button>
    </div>
  </header>

  <main>
    <section class="view active" id="view-overview">
      <div class="hook" id="hook">
        <div>
          <div class="hook-text" id="hook-text"></div>
          <div class="hook-sub" id="hook-sub"></div>
        </div>
        <button type="button" class="btn primary" id="btn-hook-share">生成分享卡</button>
      </div>
      <div class="stats" id="stats"></div>
      <div class="panel">
        <div class="panel-head">
          <h2>互动最多</h2>
          <span class="meta" id="overview-meta"></span>
        </div>
        <div class="paywall-wrap" id="overview-lock-wrap">
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>用户</th>
                  <th>标签</th>
                  <th>互动次数</th>
                  <th>占比</th>
                </tr>
              </thead>
              <tbody id="overview-body"></tbody>
            </table>
          </div>
          <div class="paywall-card" id="overview-paywall" hidden></div>
        </div>
      </div>
      <div class="footnote" id="footnote"></div>
    </section>

    <section class="view" id="view-replied-me">
      <div class="panel">
        <div class="panel-head">
          <h2>谁回复了我</h2>
          <span class="meta">按互动次数降序 · 免费 Top5</span>
        </div>
        <div class="paywall-wrap" id="replied-lock-wrap">
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>用户</th>
                  <th>回复预览</th>
                  <th>时间</th>
                  <th>占比</th>
                </tr>
              </thead>
              <tbody id="replied-me-body"></tbody>
            </table>
          </div>
          <div class="paywall-card" id="replied-paywall" hidden></div>
        </div>
      </div>
    </section>

    <section class="view" id="view-i-replied">
      <div class="panel">
        <div class="panel-head">
          <h2>我回复了谁</h2>
          <span class="meta">按我回复次数降序 · 无进度条</span>
        </div>
        <div class="paywall-wrap" id="ireplied-lock-wrap">
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>用户</th>
                  <th>内容预览</th>
                  <th>状态</th>
                  <th>我回复次数</th>
                </tr>
              </thead>
              <tbody id="i-replied-body"></tbody>
            </table>
          </div>
          <div class="paywall-card" id="ireplied-paywall" hidden></div>
        </div>
      </div>
    </section>

    <section class="view" id="view-no-reply">
      <div class="panel">
        <div class="panel-head">
          <h2>我回复了但没回我的</h2>
          <span class="meta">完整列表需解锁</span>
        </div>
        <div class="paywall-wrap" id="noreply-lock-wrap">
          <div class="table-wrap" id="noreply-table-wrap">
            <table>
              <thead>

    function computeScore(u) {
      const fromThem = u.theyReplies * 2;
      const fromMe = u.iReplies * 1;
      const mutual = (u.theyReplies > 0 && u.iReplies > 0) ? 1 : 0;
      return { fromThem, fromMe, mutual, score: fromThem + fromMe + mutual };
    }
    function formatWait(hours) {
      if (hours >= 48) {
        const d = Math.floor(hours / 24);
        const h = hours % 24;
        return h ? `${d} 天 ${h} 小时` : `${d} 天`;
      }
      if (hours >= 24) return `1 天 ${hours - 24} 小时`;
      return `${hours} 小时`;
    }
    function initials(name) { return name.slice(0, 1); }

    const scored = RAW.map(u => ({ ...u, ...computeScore(u) }));
    const totalScore = scored.reduce((a, u) => a + u.score, 0);
    const avgScore = totalScore / scored.length;
    function tagFor(score) {
      if (score >= avgScore * 3 && score >= 5) return { key: "super", label: "铁粉" };
      if (score >= avgScore && score >= 2) return { key: "fan", label: "粉丝" };
      return { key: "passer", label: "路人" };
    }
    const users = scored.map(u => {
      const ratio = totalScore ? (u.score / totalScore) * 100 : 0;
      return { ...u, ratio, tag: tagFor(u.score), bidirectional: u.theyReplies > 0 && u.iReplies > 0 };
    });
    const ratioSum = users.reduce((a, u) => a + u.ratio, 0);
    const countRepliedMe = users.filter(u => u.theyReplies > 0).length;
    const countIReplied = users.filter(u => u.iReplies > 0).length;
    const countNoReply = users.filter(u => u.iReplies > 0 && u.theyReplies === 0).length;
    const byScore = [...users].sort((a, b) => b.score - a.score);
    const noReplyList = users
      .filter(u => u.iReplies > 0 && u.theyReplies === 0)
      .sort((a, b) => b.waitHours - a.waitHours);
    const longestWait = noReplyList[0];
    const hookLine = `你回了 ${countIReplied} 人，只有 ${countRepliedMe} 人回你`;
    const hookInsight = `其中 ${countNoReply} 人一直没回 · 最长已等 ${longestWait ? formatWait(longestWait.waitHours) : "—"}`;

    function tagHtml(tag) {
      return `<span class="tag ${tag.key}">${tag.label}</span>`;

    }

      return `
        <div class="progress-cell">
          <div class="bar"><i style="width:${ratio}%"></i></div>
          <span class="pct">${r.toFixed(1)}%</span>
        </div>`;
    }

    // ========== 分享卡 Canvas ==========
    const canvas = document.getElementById("share-canvas");
    const ctx = canvas.getContext("2d");

    function roundRect(c, x, y, w, h, r) {
      c.beginPath();
      c.moveTo(x + r, y);
      c.arcTo(x + w, y, x + w, y + h, r);
      c.arcTo(x + w, y + h, x, y + h, r);
      c.arcTo(x, y + h, x, y, r);
      c.arcTo(x, y, x + w, y, r);
      c.closePath();
    }

    function drawCardChrome(title) {
      // bg
      const g = ctx.createLinearGradient(0, 0, 0, 1350);
      g.addColorStop(0, "#0c0c0e");
      g.addColorStop(0.55, "#12141a");
      g.addColorStop(1, "#0a0a0b");
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, 1080, 1350);

      // top accent line
      const ag = ctx.createLinearGradient(60, 0, 1020, 0);
      ag.addColorStop(0, "#00ba7c");
      ag.addColorStop(1, "#1d9bf0");
      ctx.fillStyle = ag;
      ctx.fillRect(60, 48, 960, 6);

      // brand
      ctx.fillStyle = "#f0f0f2";
      ctx.font = "700 36px sans-serif";
      ctx.fillText("X 互动分析", 60, 120);
      ctx.fillStyle = "#8b8b96";
      ctx.font = "500 24px sans-serif";
      ctx.fillText(title, 60, 160);

      // badge 示例
      ctx.fillStyle = "rgba(251,191,36,0.15)";
      roundRect(ctx, 780, 90, 240, 44, 22);
      ctx.fill();
      ctx.fillStyle = "#fbbf24";
      ctx.font = "600 22px sans-serif";
      ctx.fillText("示例数据 · 原型", 800, 120);

      // footer
      ctx.fillStyle = "#2a2a30";
      ctx.fillRect(60, 1240, 960, 1);
      ctx.fillStyle = "#8b8b96";
      ctx.font = "500 22px sans-serif";
      ctx.fillText("X 互动分析", 60, 1290);
      ctx.fillStyle = "#1d9bf0";
      ctx.font = "600 22px sans-serif";
      ctx.fillText("x-interact.app", 280, 1290);
      ctx.fillStyle = "#5c5c66";
      ctx.font = "500 20px sans-serif";
      ctx.fillText("非官方 · 示例", 860, 1290);
    }

    function drawOverviewCard() {
      drawCardChrome("我的互动反差");
      // big hook
      ctx.fillStyle = "#f0f0f2";
      ctx.font = "750 52px sans-serif";
      const line1 = `你回了 ${countIReplied} 人`;
      const line2 = `只有 ${countRepliedMe} 人回你`;
      ctx.fillText(line1, 60, 280);
      ctx.fillStyle = "#fb7185";
      ctx.fillText(line2, 60, 350);

      ctx.fillStyle = "#8b8b96";
      ctx.font = "500 26px sans-serif";
      ctx.fillText(hookInsight, 60, 410);

      // three stats
      const cards = [
        { label: "回复我的", val: String(countRepliedMe), color: "#00ba7c" },
        { label: "我回复的", val: String(countIReplied), color: "#1d9bf0" },
        { label: "没回我的", val: String(countNoReply), color: "#fb7185" }
      ];
      cards.forEach((c, i) => {
        const x = 60 + i * 320;
        ctx.fillStyle = "#1a1a1e";
        roundRect(ctx, x, 460, 300, 160, 20);
        ctx.fill();
        ctx.strokeStyle = "#2a2a30";
        ctx.lineWidth = 2;
        roundRect(ctx, x, 460, 300, 160, 20);
        ctx.stroke();
        ctx.fillStyle = "#8b8b96";
        ctx.font = "600 22px sans-serif";
        ctx.fillText(c.label, x + 24, 510);
        ctx.fillStyle = c.color;
        ctx.font = "750 64px sans-serif";
        ctx.fillText(c.val, x + 24, 580);
      });

      // Top3
      ctx.fillStyle = "#f0f0f2";
      ctx.font = "700 30px sans-serif";
      ctx.fillText("铁粉 Top 3", 60, 700);

      byScore.slice(0, 3).forEach((u, i) => {
        const y = 740 + i * 130;
        ctx.fillStyle = "#1a1a1e";
        roundRect(ctx, 60, y, 960, 110, 16);
        ctx.fill();
        // avatar
        ctx.beginPath();
        ctx.arc(120, y + 55, 32, 0, Math.PI * 2);
        ctx.fillStyle = u.color;
        ctx.fill();
        ctx.fillStyle = "#fff";
        ctx.font = "700 26px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(initials(u.name), 120, y + 64);
        ctx.textAlign = "left";
        ctx.fillStyle = "#f0f0f2";
        ctx.font = "650 28px sans-serif";
        ctx.fillText(u.name, 180, y + 48);
        ctx.fillStyle = "#8b8b96";
        ctx.font = "500 22px sans-serif";
        ctx.fillText(`@${u.handle} · ${u.tag.label}`, 180, y + 82);
        ctx.fillStyle = "#00ba7c";
        ctx.font = "750 36px sans-serif";
        ctx.textAlign = "right";
        ctx.fillText(String(u.score), 980, y + 64);
        ctx.textAlign = "left";
      });
    }

    function drawFansCard() {
      drawCardChrome("互动铁粉榜");
      ctx.fillStyle = "#f0f0f2";
      ctx.font = "750 48px sans-serif";
      ctx.fillText("谁最常和你互动？", 60, 280);
      ctx.fillStyle = "#8b8b96";
      ctx.font = "500 26px sans-serif";
      ctx.fillText(`Top 5 · 总互动分 ${totalScore}`, 60, 330);

      const top5 = byScore.slice(0, 5);
      const maxScore = top5[0] ? top5[0].score : 1;
      top5.forEach((u, i) => {
        const y = 380 + i * 150;
        ctx.fillStyle = "#1a1a1e";
        roundRect(ctx, 60, y, 960, 130, 16);
        ctx.fill();
        // rank
        ctx.fillStyle = i === 0 ? "#fbbf24" : "#8b8b96";
        ctx.font = "750 36px sans-serif";
        ctx.fillText(String(i + 1), 90, y + 78);
        // avatar
        ctx.beginPath();
        ctx.arc(190, y + 65, 34, 0, Math.PI * 2);
        ctx.fillStyle = u.color;
        ctx.fill();
        ctx.fillStyle = "#fff";
        ctx.font = "700 26px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(initials(u.name), 190, y + 74);
        ctx.textAlign = "left";
        ctx.fillStyle = "#f0f0f2";
        ctx.font = "650 28px sans-serif";
        ctx.fillText(u.name, 250, y + 48);
        // tag
        const tagColor = u.tag.key === "super" ? "#f97316" : u.tag.key === "fan" ? "#3b82f6" : "#6b7280";
        ctx.fillStyle = tagColor;
        ctx.font = "600 20px sans-serif";
        ctx.fillText(u.tag.label, 250, y + 78);
        // bar
        const barW = Math.max(40, (u.score / maxScore) * 420);
        ctx.fillStyle = "#1e2a24";
        roundRect(ctx, 250, y + 92, 420, 14, 7);
        ctx.fill();
        ctx.fillStyle = "#00ba7c";
        roundRect(ctx, 250, y + 92, barW, 14, 7);
        ctx.fill();
        ctx.fillStyle = "#00ba7c";
        ctx.font = "750 34px sans-serif";
        ctx.textAlign = "right";
        ctx.fillText(String(u.score), 980, y + 78);
        ctx.textAlign = "left";
      });
    }

    function drawNoReplyCard() {
      drawCardChrome("串门未回访");
      ctx.fillStyle = "#f0f0f2";
      ctx.font = "750 48px sans-serif";
      ctx.fillText("你去串门，他们没回访", 60, 280);
      ctx.fillStyle = "#fb7185";
      ctx.font = "700 32px sans-serif";
      ctx.fillText(`${noReplyList.length} 人未回访`, 60, 340);

      noReplyList.forEach((u, i) => {
        const y = 390 + i * 120;
        ctx.fillStyle = "#1a1a1e";
        roundRect(ctx, 60, y, 960, 100, 16);
        ctx.fill();
        // red dot
        ctx.beginPath();
        ctx.arc(100, y + 50, 10, 0, Math.PI * 2);
        ctx.fillStyle = "#f4212e";
        ctx.fill();
        ctx.beginPath();
        ctx.arc(170, y + 50, 30, 0, Math.PI * 2);
        ctx.fillStyle = u.color;
        ctx.fill();
        ctx.fillStyle = "#fff";
        ctx.font = "700 24px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(initials(u.name), 170, y + 58);
        ctx.textAlign = "left";
        ctx.fillStyle = "#f0f0f2";
        ctx.font = "650 28px sans-serif";
        ctx.fillText(u.name, 230, y + 42);
        ctx.fillStyle = "#8b8b96";
        ctx.font = "500 22px sans-serif";
        ctx.fillText(`串门 ${u.iReplies} 次 · 已等 ${formatWait(u.waitHours)}`, 230, y + 76);
        ctx.fillStyle = "#f4212e";
        ctx.font = "700 24px sans-serif";
        ctx.textAlign = "right";
        ctx.fillText("未回访", 980, y + 58);
        ctx.textAlign = "left";
      });

      if (longestWait) {
        const y = 390 + noReplyList.length * 120 + 20;
        ctx.fillStyle = "rgba(244,33,46,0.12)";
        roundRect(ctx, 60, y, 960, 100, 16);
        ctx.fill();
        ctx.fillStyle = "#fb7185";
        ctx.font = "700 26px sans-serif";
        ctx.fillText("最长等待", 90, y + 42);
        ctx.fillStyle = "#f0f0f2";
        ctx.font = "650 32px sans-serif";
        ctx.fillText(`${longestWait.name} · ${formatWait(longestWait.waitHours)}`, 90, y + 82);
      }
    }

    function drawCurrentCard() {
      if (currentTpl === "overview") drawOverviewCard();
      else if (currentTpl === "fans") drawFansCard();
      else drawNoReplyCard();
    }

    function postCopyText() {
      const map = {
        overview: `${hookLine}\n${hookInsight}\n用互动分看清谁真的在回你。\n#X互动分析\nhttps://x-interact.app`,
        fans: `我的 X 互动铁粉 Top5 出炉了。\n第一名 ${byScore[0].name}（${byScore[0].score} 分）。\n#X互动分析\nhttps://x-interact.app`,
        noreply: `串门 ${countIReplied} 次，${countNoReply} 人没回访。\n最长已等 ${longestWait ? formatWait(longestWait.waitHours) : "—"}（${longestWait ? longestWait.name : ""}）。\n#X互动分析\nhttps://x-interact.app`
      };
      return map[currentTpl];
    }

    function openShare(tpl) {
      if (tpl) currentTpl = tpl;
      document.querySelectorAll(".tpl-btn").forEach(b => {
        b.classList.toggle("active", b.dataset.tpl === currentTpl);
      });
      drawCurrentCard();
      document.getElementById("copy-preview").textContent = postCopyText();
      document.getElementById("share-modal").classList.add("open");
    }
    function closeShare() {
      document.getElementById("share-modal").classList.remove("open");
    }

    function toast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.classList.add("show");
      clearTimeout(toast._tm);
      toast._tm = setTimeout(() => t.classList.remove("show"), 2200);
    }

    // ========== 导航 ==========
    const views = ["overview", "replied-me", "i-replied", "no-reply", "visit"];
    function showView(id) {
      views.forEach(v => {
        document.getElementById(`view-${v}`).classList.toggle("active", v === id);
      });
      document.querySelectorAll("#nav button").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.view === id);
      });
    }
    document.getElementById("nav").addEventListener("click", e => {
      const btn = e.target.closest("button[data-view]");
      if (!btn) return;
      showView(btn.dataset.view);
    });

    // ========== 详情 ==========
    const modal = document.getElementById("modal");
    function openDetail(id) {
      const u = users.find(x => x.id === id);
      if (!u) return;
      const av = document.getElementById("m-avatar");
      av.style.background = u.color;
      av.textContent = initials(u.name);
      document.getElementById("m-name").textContent = u.name;
      document.getElementById("m-handle").textContent = "@" + u.handle;
      document.getElementById("m-tag").innerHTML = tagHtml(u.tag);
      document.getElementById("m-rows").innerHTML = `
        <div class="score-row"><span class="k">对方回复我 ${u.theyReplies} 次 × 2</span><span class="v">+${u.fromThem}</span></div>
        <div class="score-row"><span class="k">我回复对方 ${u.iReplies} 次 × 1</span><span class="v">+${u.fromMe}</span></div>
        <div class="score-row"><span class="k">双向额外 ${u.bidirectional ? "是" : "否"}</span><span class="v">+${u.mutual}</span></div>`;
      document.getElementById("m-total").textContent = u.score;
      modal.classList.add("open");
    }
    function closeDetail() { modal.classList.remove("open"); }
    document.getElementById("m-close").addEventListener("click", closeDetail);
    modal.addEventListener("click", e => { if (e.target === modal) closeDetail(); });

    document.body.addEventListener("click", e => {
      const unlockBtn = e.target.closest(".btn-demo-unlock");
      if (unlockBtn) { doUnlock(); return; }
      const el = e.target.closest("[data-id]");
      if (el && !e.target.closest(".paywall-card")) openDetail(el.dataset.id);
    });

    document.getElementById("btn-share").addEventListener("click", () => openShare("overview"));
    document.getElementById("btn-hook-share").addEventListener("click", () => openShare("overview"));
    document.getElementById("share-close").addEventListener("click", closeShare);
    document.getElementById("share-modal").addEventListener("click", e => {
      if (e.target.id === "share-modal") closeShare();
    });
    document.querySelector(".share-side").addEventListener("click", e => {
      const b = e.target.closest(".tpl-btn");
      if (!b) return;
      currentTpl = b.dataset.tpl;
      document.querySelectorAll(".tpl-btn").forEach(x => x.classList.toggle("active", x === b));
      drawCurrentCard();
      document.getElementById("copy-preview").textContent = postCopyText();
    });
    document.getElementById("btn-dl-png").addEventListener("click", () => {
      drawCurrentCard();
      const a = document.createElement("a");
      a.download = `x-interact-${currentTpl}.png`;
      a.href = canvas.toDataURL("image/png");
      a.click();
      toast("已下载 PNG");
    });
    document.getElementById("btn-copy-text").addEventListener("click", async () => {
      const text = postCopyText();
      try {
        await navigator.clipboard.writeText(text);
        toast("文案已复制");
      } catch {
        // fallback
        const ta = document.createElement("textarea");
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        ta.remove();
        toast("文案已复制");
      }
    });
    document.getElementById("btn-export").addEventListener("click", () => {
      if (!unlocked) return;
      const blob = new Blob([JSON.stringify({ users, exportedAt: new Date().toISOString(), demo: true }, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "x-interact-export-demo.json";
      a.click();
      toast("已导出演示 JSON");
    });

    document.addEventListener("keydown", e => {
      if (e.key === "Escape") {
        closeDetail();
        closeShare();
      }
    });

    renderAll();
    drawCurrentCard();

    console.table(users.map(u => ({
      name: u.name, they: u.theyReplies, me: u.iReplies,
      score: u.score, ratio: u.ratio.toFixed(2) + "%", tag: u.tag.label
    })));
    console.log("比例之和:", ratioSum.toFixed(4) + "%");
    console.log("反差:", hookLine, "| 三卡片:", { 回复我的: countRepliedMe, 我回复的: countIReplied, 没回我的: countNoReply });
  </script>
</body>
</html>
